# Wrangler configuration for local development of Cloudflare Pages Functions
# (likes + GitHub OAuth). Production bindings/secrets are configured via the
# Cloudflare dashboard — see README for the full step-by-step guide.

name = "caeastro-blog"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# Local-only placeholders. Never commit real secrets.
[vars]
GITHUB_CLIENT_ID = "dev-client-id"
COOKIE_DOMAIN = ""

# KV namespace binding is configured in the Cloudflare Pages dashboard
# (Settings → Functions → KV namespace bindings → LIKES_KV).
# For local development, run: npx wrangler pages dev ./dist --kv LIKES_KV
